<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <rect width="1000" height="330" fill="#FFFFFF"/>
  <!-- 왼쪽 주소창 -->
  <rect x="30" y="24" width="470" height="58" rx="12" fill="#F6EEDF"/>
  <rect x="44" y="34" width="306" height="38" rx="19" fill="#FFFFFF" stroke="#E8DCC6"/>
  <text x="66" y="59" font-size="16" fill="#6E604E">goe.neis.go.kr</text>
  <rect x="400" y="30" width="46" height="46" rx="8" fill="none" stroke="#6B4410" stroke-width="3"/>
  <path d="M414 44 h8 a4 4 0 0 1 8 0 h6 v8 a4 4 0 0 1 0 8 v8 h-8 a4 4 0 0 0 -8 0 h-6 z" fill="#6E604E"/>
  <circle cx="446" cy="24" r="16" fill="#6B4410"/><text x="446" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">1</text>
  <!-- 펼친 목록 -->
  <rect x="100" y="98" width="400" height="104" rx="12" fill="#FFFFFF" stroke="#E8DCC6"/>
  <text x="124" y="130" font-size="16" font-weight="700" fill="#2E2418">확장 프로그램</text>
  <rect x="116" y="144" width="368" height="46" rx="8" fill="#FDF8EE"/>
  <rect x="128" y="152" width="30" height="30" rx="7" fill="#6B4410"/>
  <rect x="135" y="157" width="14" height="19" rx="2" fill="#FFF7E6"/>
  <path d="M152 168 l6 -6" stroke="#F5B83D" stroke-width="4" stroke-linecap="round"/>
  <text x="170" y="173" font-size="15" font-weight="700" fill="#2E2418">생기부 도우미 - 나이스 연동</text>
  <rect x="432" y="148" width="40" height="38" rx="8" fill="none" stroke="#6B4410" stroke-width="3"/>
  <path d="M447 157 h10 l-2 9 l4 4 h-14 l4 -4 z M452 170 v8" fill="#2E2418" stroke="#2E2418" stroke-width="1.5"/>
  <circle cx="472" cy="144" r="16" fill="#6B4410"/><text x="472" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">2</text>
  <!-- 화살표 -->
  <path d="M520 53 L572 53" stroke="#6B4410" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 40 L576 53 L560 66" fill="none" stroke="#6B4410" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 오른쪽 고정된 모습 -->
  <rect x="590" y="24" width="380" height="58" rx="12" fill="#F6EEDF"/>
  <rect x="604" y="34" width="216" height="38" rx="19" fill="#FFFFFF" stroke="#E8DCC6"/>
  <text x="626" y="59" font-size="16" fill="#6E604E">goe.neis.go.kr</text>
  <rect x="840" y="30" width="46" height="46" rx="8" fill="none" stroke="#6B4410" stroke-width="3"/>
  <rect x="848" y="38" width="30" height="30" rx="7" fill="#6B4410"/>
  <rect x="855" y="43" width="14" height="19" rx="2" fill="#FFF7E6"/>
  <path d="M872 54 l6 -6" stroke="#F5B83D" stroke-width="4" stroke-linecap="round"/>
  <path d="M906 44 h8 a4 4 0 0 1 8 0 h6 v8 a4 4 0 0 1 0 8 v8 h-8 a4 4 0 0 0 -8 0 h-6 z" fill="#6E604E"/>
  <circle cx="886" cy="24" r="16" fill="#6B4410"/><text x="886" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">3</text>
  <text x="590" y="122" font-size="16" fill="#2E2418"><tspan font-weight="700">3</tspan> 고정하면 주소창 옆에 갈색 아이콘이 보입니다.</text>
  <text x="590" y="148" font-size="16" fill="#2E2418">나이스 화면에서 이 아이콘을 누르면</text>
  <text x="590" y="174" font-size="16" fill="#2E2418">오른쪽에 사이드 패널이 열립니다.</text>
  <text x="30" y="250" font-size="16" fill="#2E2418"><tspan font-weight="700">1</tspan> 크롬 오른쪽 위 퍼즐 모양 아이콘을 누릅니다.</text>
  <text x="30" y="276" font-size="16" fill="#2E2418"><tspan font-weight="700">2</tspan> '생기부 도우미 - 나이스 연동' 옆의 핀 모양을 누릅니다.</text>
  <text x="30" y="302" font-size="15" fill="#6E604E">(남색 체크 모양 아이콘은 출결관리 도우미입니다. 생기부는 갈색 종이와 연필 아이콘입니다.)</text>
</svg>

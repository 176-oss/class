<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 자리배치</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </link>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel (JSX 컴파일) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 저장 및 캡처 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    @media print {
      .no-print {
        display: none !important;
      }

      .print-only {
        display: block !important;
      }

      body {
        background: white;
      }

      .seat-grid {
        gap: 4px !important;
      }

      /* 인쇄 시 테두리 명확하게 */
      .seat-box {
        border: 1.5px solid #3B82F6 !important;
        box-shadow: none !important;
        break-inside: avoid;
      }

      @page {
        size: landscape;
        margin: 1cm;
      }
    }

    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #bfdbfe;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #60a5fa;
    }

    /* A4 가로 사이즈 고정 클래스 */
    .a4-landscape {
      width: 1123px;
      min-height: 794px;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    /* 카운트다운 애니메이션 */
    @keyframes popIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      30% {
        transform: scale(1.2);
        opacity: 1;
      }

      50% {
        transform: scale(1);
        opacity: 1;
      }

      90% {
        transform: scale(1);
        opacity: 1;
      }

      100% {
        transform: scale(0.8);
        opacity: 0;
      }
    }

    .animate-count {
      animation: popIn 1s ease-in-out forwards;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" data-runtime="classic">
    /** @jsxRuntime classic */
    const { useState, useEffect, useCallback, useRef } = React;

    const App = () => {
      // 상태 관리
      const [classTitle, setClassTitle] = useState("");
      const [inputText, setInputText] = useState("1번 홍길동(남)\n2번 김철수(남)\n3번 이영희(여)\n4번 박민수(남)\n5번 정수진(여)\n6번 최동훈(남)\n7번 강지민(여)\n8번 조현우(남)\n9번 윤서연(여)\n10번 장도윤(남)\n11번 임지아(여)\n12번 한우진(남)\n13번 오유나(여)\n14번 서준서(남)\n15번 신하윤(여)\n16번 권민재(남)\n17번 황서진(여)\n18번 송예준(남)\n19번 전은지(여)\n20번 유현수(남)");

      // ⭐️ 우선 배치 관련 상태 추가
      const [priorityStudentsInput, setPriorityStudentsInput] = useState("");
      const [prioritySeats, setPrioritySeats] = useState({});

      const [rows, setRows] = useState(5);
      const [cols, setCols] = useState(6);
      const [layoutMode, setLayoutMode] = useState('normal');

      const [groupRows, setGroupRows] = useState(2);
      const [groupCols, setGroupCols] = useState(2);

      const [grid, setGrid] = useState([]);
      const [fixedSeats, setFixedSeats] = useState({});
      const [draggedSeat, setDraggedSeat] = useState(null);
      const [inactiveSeats, setInactiveSeats] = useState({});

      const [showRoster, setShowRoster] = useState(true);
      const [useGenderColor, setUseGenderColor] = useState(false);
      const [modal, setModal] = useState({ isOpen: false, type: 'alert', title: '', message: '', onConfirm: null, onCancel: null });
      const [showAdvanced, setShowAdvanced] = useState(false);
      const [avoidPairs, setAvoidPairs] = useState("");
      const [genderPairing, setGenderPairing] = useState(false);
      const [savedLayouts, setSavedLayouts] = useState([]);

      const [secretSeatsInput, setSecretSeatsInput] = useState("");
      const [prevLayoutText, setPrevLayoutText] = useState("");
      const [isExporting, setIsExporting] = useState(false);
      const [printPerspective, setPrintPerspective] = useState('normal');

      // 하단 안내 문구 관련 상태
      const [footerNote, setFooterNote] = useState("※ 자리는 랜덤 프로그램을 통해 공정하게 배치되었습니다.");
      const [footerFontSize, setFooterFontSize] = useState("text-sm");
      const [footerFontWeight, setFooterFontWeight] = useState("font-medium");

      // ⭐️ 학생 명단 팝업 모달 상태 추가
      const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);

      // 발표 모드 및 카운트다운 상태
      const [isPresenting, setIsPresenting] = useState(false);
      const [countdown, setCountdown] = useState(null);

      // 설정 불러오기 파일 input 참조
      const fileInputRef = useRef(null);

      useEffect(() => {
        const initialGrid = Array(rows).fill(null).map(() => Array(cols).fill(null));
        setGrid(initialGrid);
        setFixedSeats({});
        setInactiveSeats({});
        setPrioritySeats({}); // 배열 크기 변경 시 우선 배치 초기화
      }, [rows, cols]);

      const displayName = (name) => name ? name.replace(/[\s\(\[\-]*(남|여)[\)\]\s]*$/, '').trim() : '';

      const parseStudentName = (rawName) => {
        if (!rawName) return { number: '', name: '' };
        const clean = rawName.replace(/[\s\(\[\-]*(남|여)[\)\]\s]*$/, '').trim();
        const match = clean.match(/^([0-9]+번?)\s*(.*)/);
        if (match) {
          return { number: match[1], name: match[2] || ' ' };
        }
        return { number: '', name: clean };
      };

      const cleanName = (name) => name ? name.replace(/^[0-9]+번?\s*/, '').replace(/[\s\(\[\-]*(남|여)[\)\]\s]*$/, '').trim() : '';

      const getGender = (name) => {
        if (!name) return null;
        const match = name.match(/[\s\(\[\-]*(남|여)[\)\]\s]*$/);
        return match ? (match[1] === '남' ? 'M' : 'F') : null;
      };

      const getAvoidsList = () => {
        return avoidPairs.split('\n')
          .map(line => line.split(/[,\-]/).map(n => cleanName(n.trim())).filter(n => n))
          .filter(pair => pair.length >= 2);
      };

      const getPrevPairsList = () => {
        if (!prevLayoutText.trim()) return [];
        const pairs = [];
        let parsedRows = [];

        const rawItems = prevLayoutText.split(/[\t\n\r,]+/)
          .map(item => cleanName(item.trim()))
          .filter(item => item !== "");

        const skipKeywords = ["번호", "이름", "성별", "비고", "성명", "학번", "남", "여"];
        const layoutItems = rawItems.filter(item => {
          if (skipKeywords.includes(item)) return false;
          if (/^\d+$/.test(item)) return false;
          return true;
        });

        for (let i = 0; i < layoutItems.length; i += cols) {
          parsedRows.push(layoutItems.slice(i, i + cols));
        }

        const emptyMarkers = ['빈자리', '❌', '제외'];
        for (let i = 0; i < parsedRows.length; i++) {
          for (let j = 0; j < parsedRows[i].length; j++) {
            const current = parsedRows[i][j];
            if (!current || emptyMarkers.includes(current)) continue;

            if (j + 1 < parsedRows[i].length) {
              const right = parsedRows[i][j + 1];
              if (right && !emptyMarkers.includes(right)) pairs.push([current, right]);
            }
            if (i + 1 < parsedRows.length) {
              const down = parsedRows[i + 1][j];
              if (down && !emptyMarkers.includes(down)) pairs.push([current, down]);
            }
          }
        }
        return pairs;
      };

      const checkConflict = (testGrid, r, c, studentName, targetList, mode, gr, gc) => {
        let strict = false;
        let soft = false;
        if (!studentName || targetList.length === 0) return { strict, soft };
        const clean1 = cleanName(studentName);

        for (let i = 0; i < testGrid.length; i++) {
          for (let j = 0; j < testGrid[i].length; j++) {
            if (i === r && j === c) continue;
            const targetName = testGrid[i][j];
            if (!targetName) continue;
            const clean2 = cleanName(targetName);

            const isMatch = targetList.some(pair => pair.includes(clean1) && pair.includes(clean2));
            if (!isMatch) continue;

            let isSameGroup = false;
            if (mode === 'pair') {
              if (i === r && Math.floor(j / 2) === Math.floor(c / 2)) isSameGroup = true;
            } else if (mode === 'group') {
              if (Math.floor(i / gr) === Math.floor(r / gr) && Math.floor(j / gc) === Math.floor(c / gc)) isSameGroup = true;
            }

            if (isSameGroup) strict = true;
            if (Math.abs(i - r) <= 1 && Math.abs(j - c) <= 1) soft = true;
          }
        }
        return { strict, soft };
      };

      const showAlert = (title, message) => {
        setModal({ isOpen: true, type: 'alert', title, message, onConfirm: () => setModal(prev => ({ ...prev, isOpen: false })) });
      };

      const showConfirm = (title, message, onConfirm, onCancel) => {
        setModal({
          isOpen: true,
          type: 'confirm',
          title,
          message,
          onConfirm: () => { onConfirm(); setModal(prev => ({ ...prev, isOpen: false })); },
          onCancel: () => { if (onCancel) onCancel(); setModal(prev => ({ ...prev, isOpen: false })); }
        });
      };

      const allNamesOriginal = [...new Set(inputText.split(/[,\n]/).map(n => n.trim()).filter(n => n !== ""))];
      const assignedNamesOriginal = grid.flat().filter(n => n !== null);
      const waitingList = allNamesOriginal.filter(n => !assignedNamesOriginal.includes(n));

      const executeAssign = (useSecret) => {
        let names = inputText.split(/[,\n]/).map(n => n.trim()).filter(n => n !== "");
        const uniqueNames = [...new Set(names)];

        const activeSeatCount = (rows * cols) - Object.keys(inactiveSeats).length;

        if (uniqueNames.length > activeSeatCount) {
          showAlert("인원 초과", `자리가 부족합니다!\n(학생수: ${uniqueNames.length}명 / 사용 가능 좌석수: ${activeSeatCount}석)\n행과 열을 늘리거나 숨긴 책상을 복구해 주세요.`);
          return;
        }

        // ⭐️ 우선 배치 학생 유효성 검사
        const pNames = priorityStudentsInput.split(/[,\n]/).map(n => n.trim()).filter(n => n);
        const validPNames = pNames.filter(pn => uniqueNames.some(un => cleanName(un) === cleanName(pn)));
        const availablePriorityCount = Object.keys(prioritySeats).filter(key => !inactiveSeats[key]).length;

        if (validPNames.length > availablePriorityCount) {
          showAlert("⚠️ 우선 배치 구역 초과", `지정된 우선 배치 구역(${availablePriorityCount}칸)보다 우선 배치 학생(${validPNames.length}명)이 많습니다.\n우선 구역(🌟)을 늘리거나 명단을 줄여주세요.`);
          return;
        }

        const avoids = getAvoidsList();
        const prevPairs = getPrevPairsList();

        const secretSeats = {};
        if (useSecret && secretSeatsInput.trim()) {
          secretSeatsInput.split('\n').forEach(line => {
            const parts = line.split(':');
            if (parts.length >= 2) {
              const name = cleanName(parts[0].trim());
              const posMatch = parts[1].match(/(\d+)[^\d]+(\d+)/);
              if (name && posMatch) {
                const r = parseInt(posMatch[1], 10) - 1;
                const c = parseInt(posMatch[2], 10) - 1;
                if (r >= 0 && r < rows && c >= 0 && c < cols) {
                  secretSeats[name] = { r, c };
                }
              }
            }
          });
        }

        let bestGrid = null;
        let minViolations = Infinity;
        const MAX_RETRIES = 500;

        for (let attempt = 0; attempt < MAX_RETRIES; attempt++) {
          let newGrid = Array(rows).fill(null).map(() => Array(cols).fill(null));
          let remainingNames = [...uniqueNames];

          Object.entries(secretSeats).forEach(([name, pos]) => {
            const originalName = remainingNames.find(n => cleanName(n) === name);
            if (originalName && pos.r < rows && pos.c < cols && !inactiveSeats[`${pos.r}-${pos.c}`] && newGrid[pos.r][pos.c] === null) {
              newGrid[pos.r][pos.c] = originalName;
              remainingNames = remainingNames.filter(n => n !== originalName);
            }
          });

          Object.entries(fixedSeats).forEach(([name, pos]) => {
            if (remainingNames.includes(name) && pos.r < rows && pos.c < cols && !inactiveSeats[`${pos.r}-${pos.c}`] && newGrid[pos.r][pos.c] === null) {
              newGrid[pos.r][pos.c] = name;
              remainingNames = remainingNames.filter(n => n !== name);
            }
          });

          // ⭐️ 우선 배치 학생들을 우선 배치 구역에 할당
          let unplacedPriority = remainingNames.filter(name => validPNames.some(vp => cleanName(vp) === cleanName(name)));
          remainingNames = remainingNames.filter(name => !unplacedPriority.includes(name));

          unplacedPriority.sort(() => Math.random() - 0.5);

          let emptyPrioritySeats = [];
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (newGrid[r][c] === null && !inactiveSeats[`${r}-${c}`] && prioritySeats[`${r}-${c}`]) {
                emptyPrioritySeats.push({ r, c });
              }
            }
          }
          emptyPrioritySeats.sort(() => Math.random() - 0.5);

          while (unplacedPriority.length > 0 && emptyPrioritySeats.length > 0) {
            const p = unplacedPriority.pop();
            const s = emptyPrioritySeats.pop();
            newGrid[s.r][s.c] = p;
          }

          // 혹시 남은 우선 배치 학생이 있다면 일반 남은 명단으로 합침 (보통은 위에서 에러처리 됨)
          remainingNames.push(...unplacedPriority);
          remainingNames.sort(() => Math.random() - 0.5);

          // 나머지 학생들을 남은 자리에 무작위 배치
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              if (newGrid[r][c] === null && !inactiveSeats[`${r}-${c}`] && remainingNames.length > 0) {
                newGrid[r][c] = remainingNames.pop();
              }
            }
          }

          let violations = 0;
          for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
              const studentA = newGrid[r][c];
              if (!studentA) continue;

              const avoidConflict = checkConflict(newGrid, r, c, studentA, avoids, layoutMode, groupRows, groupCols);
              if (avoidConflict.strict) violations += 10000;
              if (avoidConflict.soft) violations += 100;

              const prevConflict = checkConflict(newGrid, r, c, studentA, prevPairs, layoutMode, groupRows, groupCols);
              if (prevConflict.strict) violations += 500;
              if (prevConflict.soft) violations += 5;

              if (genderPairing && layoutMode === 'pair') {
                if (c % 2 === 0 && c < cols - 1) {
                  const partner = newGrid[r][c + 1];
                  if (partner) {
                    const gA = getGender(studentA);
                    const gB = getGender(partner);
                    if (gA && gB && gA === gB) violations += 10;
                  }
                }
              }
            }
          }

          if (violations === 0) {
            bestGrid = newGrid;
            minViolations = 0;
            break;
          }
          if (violations < minViolations) {
            minViolations = violations;
            bestGrid = newGrid;
          }
        }

        setGrid(bestGrid);

        if (!isPresenting) {
          if (minViolations >= 10000) {
            showAlert("⚠️ 배치 알림", "공간이 부족하여 '강제 기피 대상'을 다른 조로 완벽히 분리하지 못했습니다. 배치 결과를 확인해 주세요.");
          } else if (minViolations >= 500) {
            showAlert("💡 배치 알림", "강제 기피 대상은 성공적으로 분리되었으나, 자리가 부족해 '이전 짝꿍/모둠'이었던 학생 일부가 다시 같은 조에 배치되었습니다.");
          } else if (minViolations > 0) {
            showAlert("💡 배치 알림", "모든 학생이 다른 조로 분리되었으나, 일부 학생이 이전 짝꿍이나 기피 대상 근처(대각선 등)에 배치되었습니다.");
          }
        }
      };

      const handleAssignClick = (e) => {
        if (countdown !== null) return;

        const useSecret = !isPresenting || e.ctrlKey || e.metaKey;

        if (isPresenting && layoutMode !== 'manual') {
          let currentCount = 3;
          setCountdown(currentCount);

          const timer = setInterval(() => {
            currentCount--;
            if (currentCount > 0) {
              setCountdown(currentCount);
            } else {
              clearInterval(timer);
              setCountdown(null);
              executeAssign(useSecret);
            }
          }, 1000);
        } else {
          executeAssign(useSecret);
        }
      };

      const handleClear = () => {
        showConfirm("전체 비우기", "모든 자리를 비우시겠습니까?\n(고정석, 우선 구역, 책상 배열 정보는 유지됩니다)", () => {
          const emptyGrid = Array(rows).fill(null).map(() => Array(cols).fill(null));
          Object.entries(fixedSeats).forEach(([name, pos]) => {
            if (pos.r < rows && pos.c < cols && !inactiveSeats[`${pos.r}-${pos.c}`]) {
              emptyGrid[pos.r][pos.c] = name;
            }
          });
          setGrid(emptyGrid);
        });
      };

      const toggleFixed = (r, c, name) => {
        if (!name) return;
        setFixedSeats(prev => {
          const newFixed = { ...prev };
          if (newFixed[name]) {
            delete newFixed[name];
          } else {
            Object.keys(newFixed).forEach(key => {
              if (newFixed[key].r === r && newFixed[key].c === c) delete newFixed[key];
            });
            newFixed[name] = { r, c };
          }
          return newFixed;
        });
      };

      // ⭐️ 3단계 좌석 상태 토글: 기본 -> 우선배치 -> 비활성 -> 기본
      const toggleSeatState = (r, c) => {
        if (grid[r][c] !== null) return; // 사람이 있으면 변경 불가
        const key = `${r}-${c}`;

        if (!prioritySeats[key] && !inactiveSeats[key]) {
          // 기본 -> 우선배치
          setPrioritySeats(prev => ({ ...prev, [key]: true }));
        } else if (prioritySeats[key]) {
          // 우선배치 -> 비활성(❌)
          setPrioritySeats(prev => {
            const next = { ...prev };
            delete next[key];
            return next;
          });
          setInactiveSeats(prev => ({ ...prev, [key]: true }));
        } else if (inactiveSeats[key]) {
          // 비활성 -> 기본
          setInactiveSeats(prev => {
            const next = { ...prev };
            delete next[key];
            return next;
          });
        }
      };

      const onDragStartFromGrid = (e, r, c, name) => {
        setDraggedSeat({ source: 'grid', r, c, name });
        e.dataTransfer.effectAllowed = "move";
      };

      const onDragStartFromWaiting = (e, name) => {
        setDraggedSeat({ source: 'waiting', name });
        e.dataTransfer.effectAllowed = "move";
      };

      const onDragOverGrid = (e, r, c) => {
        if (inactiveSeats[`${r}-${c}`]) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      };

      const onDragOverWaiting = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
      };

      const onDropToGrid = (e, targetR, targetC) => {
        e.preventDefault();
        if (!draggedSeat) return;
        if (inactiveSeats[`${targetR}-${targetC}`]) return;

        const newGrid = [...grid.map(row => [...row])];
        const avoids = getAvoidsList();
        const prevPairs = getPrevPairsList();

        let proposedFixedSeats = { ...fixedSeats };
        let hasAvoidConflict = false;
        let hasPrevConflict = false;

        if (draggedSeat.source === 'grid') {
          const sourceR = draggedSeat.r;
          const sourceC = draggedSeat.c;
          if (sourceR === targetR && sourceC === targetC) {
            setDraggedSeat(null);
            return;
          }

          const temp = newGrid[sourceR][sourceC];
          newGrid[sourceR][sourceC] = newGrid[targetR][targetC];
          newGrid[targetR][targetC] = temp;

          const avoidC1 = checkConflict(newGrid, targetR, targetC, newGrid[targetR][targetC], avoids, layoutMode, groupRows, groupCols);
          const avoidC2 = checkConflict(newGrid, sourceR, sourceC, newGrid[sourceR][sourceC], avoids, layoutMode, groupRows, groupCols);
          if (avoidC1.strict || avoidC1.soft || avoidC2.strict || avoidC2.soft) hasAvoidConflict = true;

          const prevC1 = checkConflict(newGrid, targetR, targetC, newGrid[targetR][targetC], prevPairs, layoutMode, groupRows, groupCols);
          const prevC2 = checkConflict(newGrid, sourceR, sourceC, newGrid[sourceR][sourceC], prevPairs, layoutMode, groupRows, groupCols);
          if (prevC1.strict || prevC2.strict) hasPrevConflict = true;

          const nameA = newGrid[sourceR][sourceC];
          const nameB = newGrid[targetR][targetC];
          if (nameA && proposedFixedSeats[nameA]) proposedFixedSeats[nameA] = { r: sourceR, c: sourceC };
          if (nameB && proposedFixedSeats[nameB]) proposedFixedSeats[nameB] = { r: targetR, c: targetC };

        } else if (draggedSeat.source === 'waiting') {
          newGrid[targetR][targetC] = draggedSeat.name;

          const avoidC = checkConflict(newGrid, targetR, targetC, newGrid[targetR][targetC], avoids, layoutMode, groupRows, groupCols);
          if (avoidC.strict || avoidC.soft) hasAvoidConflict = true;

          const prevC = checkConflict(newGrid, targetR, targetC, newGrid[targetR][targetC], prevPairs, layoutMode, groupRows, groupCols);
          if (prevC.strict) hasPrevConflict = true;
        }

        const applyChanges = () => {
          setGrid(newGrid);
          setFixedSeats(proposedFixedSeats);
          setDraggedSeat(null);
        };

        if (isPresenting) {
          applyChanges();
        } else {
          if (hasAvoidConflict) {
            showConfirm(
              "⚠️ 배치 불가 주의!",
              "해당 위치로 이동하면 [강제 기피 대상]과 같은 조가 되거나 근처에 인접하게 됩니다.\n그래도 배치를 강행하시겠습니까?",
              applyChanges,
              () => setDraggedSeat(null)
            );
          } else if (hasPrevConflict) {
            showConfirm(
              "💡 이전 자리 중복",
              "해당 위치로 이동하면 [이전 자리에서 인접했던 학생]과 다시 같은 조가 됩니다.\n이대로 배치하시겠습니까?",
              applyChanges,
              () => setDraggedSeat(null)
            );
          } else {
            applyChanges();
          }
        }
      };

      const onDropToWaitingList = (e) => {
        e.preventDefault();
        if (!draggedSeat || draggedSeat.source === 'waiting') return;

        const newGrid = [...grid.map(row => [...row])];
        newGrid[draggedSeat.r][draggedSeat.c] = null;
        setGrid(newGrid);

        setFixedSeats(prev => {
          const newFixed = { ...prev };
          delete newFixed[draggedSeat.name];
          return newFixed;
        });
        setDraggedSeat(null);
      };

      const handleCopyCurrentToPrev = () => {
        const text = grid.map((row, r) =>
          row.map((name, c) => name ? cleanName(name) : (inactiveSeats[`${r}-${c}`] ? "제외" : "빈자리")).join('\t')
        ).join('\n');
        setPrevLayoutText(text);
        showAlert("적용 완료", "현재 화면의 배치가 '이전 자리 배치표'로 자동 입력되었습니다.\n이제 섞기를 누르면 지금 옆에 있는 친구와 찢어지게 배치됩니다!");
      };

      const handlePrintClick = () => {
        setModal({
          isOpen: true,
          type: 'export',
          title: '💾 인쇄 및 설정 관리',
          message: '배치도를 파일로 저장/인쇄하거나,\n현재의 모든 설정을 백업하고 복구할 수 있습니다.',
          onConfirm: null,
          onCancel: () => setModal(prev => ({ ...prev, isOpen: false }))
        });
      };

      const handleExport = async (format) => {
        const element = document.getElementById('capture-area');
        if (!element || !window.html2canvas || (!window.jspdf && format === 'pdf')) {
          showAlert("저장 오류", "저장 라이브러리를 불러오지 못했습니다. 잠시 후 다시 시도하거나 [기본 인쇄]를 이용해 주세요.");
          return;
        }

        setIsExporting(true);

        const hideElements = element.querySelectorAll('.no-print');
        const originalDisplays = [];
        hideElements.forEach(el => {
          originalDisplays.push(el.style.display);
          el.style.display = 'none';
        });

        const printOnlyElements = element.querySelectorAll('.print-only');
        const originalPrintDisplays = [];
        printOnlyElements.forEach(el => {
          originalPrintDisplays.push(el.style.display);
          el.style.display = 'block';
        });

        try {
          const canvas = await window.html2canvas(element, {
            scale: 2,
            backgroundColor: '#ffffff',
            useCORS: true,
            logging: false,
            windowWidth: element.scrollWidth,
            windowHeight: element.scrollHeight
          });
          const imgData = canvas.toDataURL('image/png');

          if (format === 'image') {
            const link = document.createElement('a');
            link.download = `자리배치도_${new Date().getTime()}.png`;
            link.href = imgData;
            link.click();
            setModal(prev => ({ ...prev, isOpen: false }));
            showAlert("저장 완료", "배치도가 이미지(PNG) 파일로 저장되었습니다.");
          } else if (format === 'pdf') {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ orientation: canvas.width > canvas.height ? 'landscape' : 'portrait', unit: 'px', format: [canvas.width, canvas.height] });
            pdf.addImage(imgData, 'PNG', 0, 0, canvas.width, canvas.height);
            pdf.save(`자리배치도_${new Date().getTime()}.pdf`);
            setModal(prev => ({ ...prev, isOpen: false }));
            showAlert("저장 완료", "배치도가 PDF 파일로 저장되었습니다.");
          }
        } catch (err) {
          setModal(prev => ({ ...prev, isOpen: false }));
          showAlert("저장 실패", "저장 중 오류가 발생했습니다. 키보드 단축키 [ Ctrl + P ]를 이용하여 인쇄/저장해 주세요.");
        } finally {
          hideElements.forEach((el, idx) => el.style.display = originalDisplays[idx]);
          printOnlyElements.forEach((el, idx) => el.style.display = originalPrintDisplays[idx]);
          setIsExporting(false);
        }
      };

      const saveCurrentLayout = () => {
        if (grid.every(row => row.every(seat => seat === null))) {
          showAlert("저장 실패", "저장할 배치가 없습니다.");
          return;
        }
        const time = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        setSavedLayouts(prev => [{
          time,
          grid: grid.map(r => [...r]),
          fixedSeats: { ...fixedSeats },
          inactiveSeats: { ...inactiveSeats },
          prioritySeats: { ...prioritySeats },
          secretSeatsInput,
          priorityStudentsInput
        }, ...prev].slice(0, 5));
        showAlert("저장 완료", "현재 배치가 기록되었습니다.");
      };

      const loadLayout = (savedObj) => {
        showConfirm("기록 불러오기", `[${savedObj.time}] 배치를 불러오시겠습니까?\n현재 화면이 덮어씌워집니다.`, () => {
          setGrid(savedObj.grid.map(r => [...r]));
          setFixedSeats(savedObj.fixedSeats);
          setInactiveSeats(savedObj.inactiveSeats || {});
          if (savedObj.prioritySeats) setPrioritySeats(savedObj.prioritySeats);
          if (savedObj.secretSeatsInput !== undefined) setSecretSeatsInput(savedObj.secretSeatsInput);
          if (savedObj.priorityStudentsInput !== undefined) setPriorityStudentsInput(savedObj.priorityStudentsInput);
        });
      };

      const handleExportSettings = () => {
        const settings = {
          classTitle, inputText, rows, cols, layoutMode, groupRows, groupCols,
          grid, fixedSeats, inactiveSeats, prioritySeats, priorityStudentsInput,
          useGenderColor, avoidPairs, genderPairing, secretSeatsInput, prevLayoutText,
          footerNote, footerFontSize, footerFontWeight
        };
        const blob = new Blob([JSON.stringify(settings, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
        link.download = `스마트자리배치_설정백업_${dateStr}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        setModal(prev => ({ ...prev, isOpen: false }));
        setTimeout(() => showAlert("백업 완료", "모든 설정이 성공적으로 저장되었습니다.\n나중에 [설정 불러오기]를 통해 언제든 이 설정 그대로 복구할 수 있습니다."), 300);
      };

      const handleImportSettings = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const settings = JSON.parse(event.target.result);

            if (settings.inputText !== undefined) setInputText(settings.inputText);
            if (settings.classTitle !== undefined) setClassTitle(settings.classTitle);
            if (settings.rows !== undefined) setRows(settings.rows);
            if (settings.cols !== undefined) setCols(settings.cols);
            if (settings.layoutMode !== undefined) setLayoutMode(settings.layoutMode);
            if (settings.groupRows !== undefined) setGroupRows(settings.groupRows);
            if (settings.groupCols !== undefined) setGroupCols(settings.groupCols);
            if (settings.grid !== undefined) setGrid(settings.grid);
            if (settings.fixedSeats !== undefined) setFixedSeats(settings.fixedSeats);
            if (settings.inactiveSeats !== undefined) setInactiveSeats(settings.inactiveSeats);
            if (settings.prioritySeats !== undefined) setPrioritySeats(settings.prioritySeats);
            if (settings.priorityStudentsInput !== undefined) setPriorityStudentsInput(settings.priorityStudentsInput);
            if (settings.useGenderColor !== undefined) setUseGenderColor(settings.useGenderColor);
            if (settings.avoidPairs !== undefined) setAvoidPairs(settings.avoidPairs);
            if (settings.genderPairing !== undefined) setGenderPairing(settings.genderPairing);
            if (settings.secretSeatsInput !== undefined) setSecretSeatsInput(settings.secretSeatsInput);
            if (settings.prevLayoutText !== undefined) setPrevLayoutText(settings.prevLayoutText);
            if (settings.footerNote !== undefined) setFooterNote(settings.footerNote);
            if (settings.footerFontSize !== undefined) setFooterFontSize(settings.footerFontSize);
            if (settings.footerFontWeight !== undefined) setFooterFontWeight(settings.footerFontWeight);

            setModal(prev => ({ ...prev, isOpen: false }));
            setTimeout(() => showAlert("복구 완료", "설정 파일을 성공적으로 불러왔습니다!"), 300);
          } catch (err) {
            showAlert("불러오기 실패", "올바른 설정 파일(.json)이 아니거나 파일이 손상되었습니다.");
          }
        };
        reader.readAsText(file);
        e.target.value = null;
      };

      const renderRows = printPerspective === 'teacher' ? [...Array(rows)].map((_, i) => rows - 1 - i) : [...Array(rows)].map((_, i) => i);
      const renderCols = printPerspective === 'teacher' ? [...Array(cols)].map((_, i) => cols - 1 - i) : [...Array(cols)].map((_, i) => i);

      const getSeatMarginClass = (r, c) => {
        let classes = "transition-all duration-300 ease-in-out ";
        if (printPerspective === 'normal') {
          if (layoutMode === 'pair') {
            if (c % 2 === 1 && c !== cols - 1) classes += "mr-2 sm:mr-5 lg:mr-8 ";
          } else if (layoutMode === 'group') {
            if (c % groupCols === groupCols - 1 && c !== cols - 1) classes += "mr-2 sm:mr-5 lg:mr-8 ";
            if (r % groupRows === groupRows - 1 && r !== rows - 1) classes += "mb-2 sm:mb-5 lg:mb-8 ";
          }
        } else {
          if (layoutMode === 'pair') {
            if (c > 0 && (c - 1) % 2 === 1) classes += "mr-2 sm:mr-5 lg:mr-8 ";
          } else if (layoutMode === 'group') {
            if (c > 0 && (c - 1) % groupCols === groupCols - 1) classes += "mr-2 sm:mr-5 lg:mr-8 ";
            if (r > 0 && (r - 1) % groupRows === groupRows - 1) classes += "mb-2 sm:mb-5 lg:mb-8 ";
          }
        }
        return classes;
      };

      const getSeatSizeClass = () => {
        if (cols >= 9) return "w-[3rem] h-[2.5rem] sm:w-[3.5rem] sm:h-[3rem] md:w-[4rem] md:h-[3.5rem] lg:w-[4.5rem] lg:h-[3.5rem]";
        if (cols >= 7) return "w-[3.5rem] h-[3rem] sm:w-[4.5rem] sm:h-[3.5rem] md:w-[5rem] md:h-[4rem] lg:w-[5.5rem] lg:h-[4.5rem]";
        if (layoutMode !== 'normal') return "w-[4rem] h-[3.5rem] sm:w-[4.5rem] sm:h-[4rem] md:w-[5.5rem] md:h-[4.5rem] lg:w-[6.5rem] lg:h-[5rem]";
        return "w-[4.5rem] h-[4rem] sm:w-[5.5rem] sm:h-[4.5rem] md:w-[6.5rem] md:h-[5rem] lg:w-[7.5rem] lg:h-[5.5rem]";
      };
      const seatSizeClass = getSeatSizeClass();

      return (
        <div className="h-screen bg-gray-50 flex flex-col md:flex-row text-gray-800 font-sans overflow-hidden relative">

          <div className="no-print w-full md:w-80 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col shadow-lg z-10 flex-shrink-0 h-[45vh] md:h-full">
            <div className="p-3 sm:p-4 overflow-y-auto flex-1 flex flex-col gap-2.5">

              <div className="flex justify-between items-center w-full border-b border-gray-100 pb-2 mb-1">
                <div
                  className={`flex items-center gap-1.5 w-fit ${isPresenting ? 'cursor-default opacity-80' : 'cursor-pointer group'}`}
                  onClick={() => { if (!isPresenting) setShowAdvanced(true); }}
                  title={isPresenting ? "발표 모드 중 (고급 설정 잠김)" : "고급 설정 열기 (선생님 전용)"}
                >
                  <div className={`p-1.5 rounded-lg transition-colors shadow-sm ${isPresenting ? 'bg-gray-100 text-gray-500' : 'bg-gray-100 text-gray-600 group-hover:bg-indigo-100 group-hover:text-indigo-600'}`}>
                    <i className="fa-solid fa-users text-base"></i>
                  </div>
                  <h1 className={`text-sm font-bold tracking-tight transition-colors whitespace-nowrap ${isPresenting ? 'text-gray-800' : 'text-gray-900 group-hover:text-indigo-600'}`}>
                    자리배치 설정
                  </h1>
                  {!isPresenting && <i className="fa-solid fa-gear text-gray-400 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] ml-1"></i>}
                </div>

                <button
                  onClick={() => setIsPresenting(!isPresenting)}
                  className={`p-2 rounded-full transition-all flex items-center justify-center ${isPresenting ? 'bg-blue-50 text-blue-600 shadow-inner' : 'text-gray-400 hover:bg-gray-100 hover:text-gray-600'}`}
                  title="발표 모드 전환 (학생들 모르게 클릭하세요)"
                >
                  <i className={`fa-solid ${isPresenting ? 'fa-tv' : 'fa-desktop'} text-sm`}></i>
                </button>
              </div>

              <div className="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                <h2 className="text-[11px] sm:text-xs font-semibold text-gray-700 mb-1.5">학급 타이틀 (선택)</h2>
                <input
                  type="text"
                  className="w-full border border-gray-300 rounded p-1.5 text-center focus:ring-2 focus:ring-blue-500 outline-none text-xs"
                  placeholder="예: 3학년 10반 자리배치표"
                  value={classTitle}
                  onChange={(e) => setClassTitle(e.target.value)}
                />
              </div>

              <div className="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                <h2 className="text-[11px] sm:text-xs font-semibold text-gray-700 mb-1.5">교실 크기 (행 x 열)</h2>
                <div className="flex gap-1.5 mb-2">
                  <button onClick={() => { setRows(5); setCols(6); }} className="flex-1 py-1 px-1 text-[11px] font-medium bg-white border border-gray-300 rounded hover:bg-gray-100 transition-colors">5x6</button>
                  <button onClick={() => { setRows(6); setCols(5); }} className="flex-1 py-1 px-1 text-[11px] font-medium bg-white border border-gray-300 rounded hover:bg-gray-100 transition-colors">6x5</button>
                  <button onClick={() => { setRows(6); setCols(6); }} className="flex-1 py-1 px-1 text-[11px] font-medium bg-white border border-gray-300 rounded hover:bg-gray-100 transition-colors">6x6</button>
                </div>
                <div className="flex gap-3">
                  <div className="flex-1">
                    <label className="text-[9px] text-gray-500 block mb-0.5">행 (세로줄)</label>
                    <input type="number" min="1" max="10" value={rows} onChange={(e) => setRows(Number(e.target.value))} className="w-full border border-gray-300 rounded p-1 text-center focus:ring-2 focus:ring-blue-500 outline-none text-xs" />
                  </div>
                  <div className="flex-1">
                    <label className="text-[9px] text-gray-500 block mb-0.5">열 (가로줄)</label>
                    <input type="number" min="1" max="10" value={cols} onChange={(e) => setCols(Number(e.target.value))} className="w-full border border-gray-300 rounded p-1 text-center focus:ring-2 focus:ring-blue-500 outline-none text-xs" />
                  </div>
                </div>
                <p className="text-[9px] text-gray-500 mt-2 pt-1.5 border-t border-gray-200">
                  💡 <b>Tip:</b> 빈자리 클릭 ➔ <b>🌟우선구역</b> ➔ <b>❌불가</b> ➔ <b>기본</b>
                </p>
              </div>

              <div className="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                <h2 className="text-[11px] sm:text-xs font-semibold text-gray-700 mb-1.5 flex items-center gap-1.5"><i className="fa-solid fa-eye"></i> 교탁 시점</h2>
                <div className="flex gap-1.5">
                  <button
                    onClick={() => setPrintPerspective('normal')}
                    className={`flex-1 py-1.5 px-1 text-[10px] font-bold rounded-lg border transition-colors ${printPerspective === 'normal' ? 'bg-blue-100 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'}`}
                  >
                    ⬆️ 기본
                  </button>
                  <button
                    onClick={() => setPrintPerspective('teacher')}
                    className={`flex-1 py-1.5 px-1 text-[10px] font-bold rounded-lg border transition-colors ${printPerspective === 'teacher' ? 'bg-blue-100 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-100'}`}
                  >
                    ⬇️ 반전
                  </button>
                </div>
              </div>

              <div className="bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                <h2 className="text-[11px] sm:text-xs font-semibold text-gray-700 mb-1.5">배치 모드</h2>
                <div className="grid grid-cols-4 gap-1.5">
                  <button onClick={() => setLayoutMode('normal')} className={`flex flex-col items-center p-1 border rounded-lg transition-colors ${layoutMode === 'normal' ? 'bg-blue-50 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                    <i className="fa-solid fa-table-cells mb-0.5 text-xs"></i><span className="text-[9px] font-bold">기본</span>
                  </button>
                  <button onClick={() => setLayoutMode('pair')} className={`flex flex-col items-center p-1 border rounded-lg transition-colors ${layoutMode === 'pair' ? 'bg-blue-50 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                    <i className="fa-solid fa-right-left mb-0.5 text-xs"></i><span className="text-[9px] font-bold">짝꿍</span>
                  </button>
                  <button onClick={() => setLayoutMode('group')} className={`flex flex-col items-center p-1 border rounded-lg transition-colors ${layoutMode === 'group' ? 'bg-blue-50 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                    <i className="fa-solid fa-users-rectangle mb-0.5 text-xs"></i><span className="text-[9px] font-bold">모둠</span>
                  </button>
                  <button onClick={() => setLayoutMode('manual')} className={`flex flex-col items-center p-1 border rounded-lg transition-colors ${layoutMode === 'manual' ? 'bg-blue-50 border-blue-400 text-blue-700 shadow-sm' : 'bg-white border-gray-300 text-gray-600 hover:bg-gray-50'}`}>
                    <i className="fa-solid fa-hand-pointer mb-0.5 text-xs"></i><span className="text-[9px] font-bold">직접</span>
                  </button>
                </div>
                {layoutMode === 'group' && (
                  <div className="mt-1.5 bg-white p-1.5 rounded border border-gray-200 shadow-sm">
                    <label className="text-[9px] font-bold text-gray-700 block mb-0.5">👥 모둠 구성</label>
                    <select value={`${groupRows}x${groupCols}`} onChange={(e) => { const [r, c] = e.target.value.split('x'); setGroupRows(Number(r)); setGroupCols(Number(c)); }} className="w-full text-[10px] border border-gray-300 rounded p-1 outline-none focus:border-blue-500 bg-gray-50">
                      <option value="2x2">4명 (2줄x2칸)</option>
                      <option value="2x3">6명 (2줄x3칸)</option>
                      <option value="3x2">6명 (3줄x2칸)</option>
                      <option value="2x4">8명 (2줄x4칸)</option>
                    </select>
                  </div>
                )}
              </div>

              {/* ⭐️ 팝업 버튼 및 간소화된 명단 옵션 영역 */}
              <div className="bg-indigo-50 p-2.5 rounded-xl border border-indigo-100 flex flex-col gap-2">
                <button
                  onClick={() => setIsStudentModalOpen(true)}
                  className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm text-xs"
                >
                  <i className="fa-solid fa-list-ul"></i> 명단 및 우선구역 설정
                </button>

                <div className="flex flex-col gap-1.5">
                  <div className="flex items-center gap-1.5">
                    <input type="checkbox" id="use-gender-color" checked={useGenderColor} onChange={(e) => setUseGenderColor(e.target.checked)} className="w-3 h-3 text-indigo-600 rounded border-gray-300 cursor-pointer" />

                      현재 배치 기록하기
                    </button>

                    {savedLayouts.length > 0 && (
                      <div className="space-y-1.5 sm:space-y-2 mt-2">
                        <label className="text-[10px] sm:text-xs text-gray-500 font-bold block mb-1">⏱ 이전 기록 불러오기</label>
                        {savedLayouts.map((saved, idx) => (
                          <button
                            key={idx}
                            onClick={() => { loadLayout(saved); setShowAdvanced(false); }}
                            className="w-full text-left px-2 sm:px-3 py-1.5 sm:py-2 text-xs sm:text-sm bg-white border border-gray-300 rounded-lg hover:bg-gray-50 flex items-center gap-2 shadow-sm transition-colors"
                          >
                            <i className="fa-solid fa-clock-rotate-left text-gray-400"></i>
                            <span className="font-medium text-gray-700">{saved.time}</span> 배치로 되돌리기
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* ⭐️ 인쇄 및 저장 / 백업 모달 */}
          {modal.isOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-[60] flex justify-center items-center p-4 no-print">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">
                <div className="p-5 sm:p-6 border-b border-gray-100">
                  <h3 className={`font-bold text-lg sm:text-xl flex items-center gap-2 ${modal.title.includes('주의') || modal.title.includes('⚠️') || modal.title.includes('실패') ? 'text-red-600' : (modal.title.includes('💡') ? 'text-amber-600' : 'text-gray-800')}`}>
                    {modal.type === 'export' ? <i className="fa-solid fa-folder-open text-indigo-500"></i> : null}
                    {modal.title}
                  </h3>
                  {modal.type !== 'export' && (
                    <p className="text-sm text-gray-600 mt-2 whitespace-pre-wrap leading-relaxed">
                      {modal.message}
                    </p>
                  )}
                </div>

                {modal.type === 'export' && (
                  <div className="p-5 sm:p-6 space-y-6 bg-gray-50">

                    {/* 1. 이미지 및 PDF 저장 */}
                    <div>
                      <h4 className="text-sm font-bold text-gray-700 mb-3 flex items-center gap-1.5">
                        <i className="fa-solid fa-image text-gray-400"></i> 배치도 파일로 저장하기
                      </h4>
                      <div className="flex gap-2">
                        <button
                          onClick={() => handleExport('image')}
                          disabled={isExporting}
                          className="flex-1 flex flex-col items-center justify-center gap-1.5 bg-white hover:bg-indigo-50 text-indigo-700 py-3 rounded-xl font-bold border border-indigo-200 transition-all shadow-sm"
                        >
                          {isExporting ? <span className="text-xs">⏳ 캡처 중...</span> : <><i className="fa-solid fa-file-image text-xl"></i><span className="text-xs">이미지 (PNG)</span></>}
                        </button>
                        <button
                          onClick={() => handleExport('pdf')}
                          disabled={isExporting}
                          className="flex-1 flex flex-col items-center justify-center gap-1.5 bg-white hover:bg-rose-50 text-rose-700 py-3 rounded-xl font-bold border border-rose-200 transition-all shadow-sm"
                        >
                          {isExporting ? <span className="text-xs">⏳ 변환 중...</span> : <><i className="fa-solid fa-file-pdf text-xl"></i><span className="text-xs">문서 (PDF)</span></>}
                        </button>
                      </div>
                      <button
                        onClick={() => {
                          setModal(prev => ({ ...prev, isOpen: false }));
                          try { window.print(); } catch (e) { }
                          setTimeout(() => showAlert("🖨️ 기본 인쇄", "키보드 단축키 [ Ctrl + P ] (Mac은 Cmd + P) 를 누르시면 브라우저 기본 인쇄창이 열립니다."), 300);
                        }}
                        disabled={isExporting}
                        className="w-full mt-2 flex items-center justify-center gap-2 bg-gray-200 hover:bg-gray-300 text-gray-700 py-2.5 rounded-lg font-medium transition-colors text-sm"
                      >
                        <i className="fa-solid fa-print"></i> 프린터로 바로 인쇄 (Ctrl+P)
                      </button>
                    </div>

                    <div className="border-t border-gray-200"></div>

                    {/* 2. 설정 백업 및 복구 */}
                    <div>
                      <h4 className="text-sm font-bold text-gray-700 mb-2 flex items-center gap-1.5">
                        <i className="fa-solid fa-database text-gray-400"></i> 모든 설정 백업 및 복구
                      </h4>
                      <p className="text-[11px] text-gray-500 mb-3 leading-tight">
                        입력된 명단, 자리, 기피 대상 등 모든 설정을 저장하거나 다른 기기에서 불러옵니다.
                      </p>
                      <div className="flex gap-2">
                        <button
                          onClick={handleExportSettings}
                          className="flex-1 py-2 text-xs bg-white text-gray-800 font-bold rounded-lg border border-gray-300 hover:bg-gray-100 transition-colors shadow-sm flex items-center justify-center gap-1.5"
                        >
                          <i className="fa-solid fa-download"></i> 내보내기
                        </button>
                        <label
                          className="flex-1 py-2 text-xs bg-gray-800 text-white font-bold rounded-lg hover:bg-gray-900 transition-colors shadow-sm cursor-pointer flex items-center justify-center gap-1.5"
                        >
                          <i className="fa-solid fa-upload"></i> 불러오기
                          <input type="file" accept=".json" className="hidden" ref={fileInputRef} onChange={handleImportSettings} />
                        </label>
                      </div>
                    </div>

                    <button
                      onClick={modal.onCancel}
                      disabled={isExporting}
                      className="w-full pt-2 text-sm font-medium text-gray-400 hover:text-gray-600 transition-colors"
                    >
                      닫기
                    </button>
                  </div>
                )}

                {modal.type !== 'export' && (
                  <div className="bg-gray-50 px-4 py-3 flex justify-end gap-2 border-t border-gray-100">
                    {modal.type === 'confirm' && (
                      <button
                        onClick={modal.onCancel}
                        className="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors"
                      >
                        취소
                      </button>
                    )}
                    <button
                      onClick={modal.onConfirm}
                      className={`px-4 py-2 text-sm font-medium text-white rounded-lg transition-colors ${modal.type === 'confirm' ? (modal.title.includes('💡') ? 'bg-amber-500 hover:bg-amber-600' : 'bg-red-600 hover:bg-red-700') : 'bg-blue-600 hover:bg-blue-700'}`}
                    >
                      확인
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ⭐️ 카운트다운 오버레이 */}
          {countdown !== null && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm no-print">
              <div key={countdown} className="text-[10rem] sm:text-[15rem] md:text-[20rem] font-black text-white drop-shadow-2xl animate-count">
                {countdown}
              </div>
            </div>
          )}

          {/* ⭐️ 학생 명단 및 우선 배치 관리 팝업 모달 */}
          {isStudentModalOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 z-[80] flex justify-center items-center p-3 sm:p-4 no-print">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden flex flex-col animate-in fade-in zoom-in-95 duration-200">
                <div className="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50">
                  <h3 className="font-bold text-gray-800 flex items-center gap-2 text-sm sm:text-base">
                    <i className="fa-solid fa-list-ul text-indigo-500"></i> 학생 명단 및 우선 배치 관리
                  </h3>
                  <button onClick={() => setIsStudentModalOpen(false)} className="text-gray-400 hover:text-gray-600 p-1 rounded-md hover:bg-gray-200 transition-colors">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="p-4 sm:p-5 space-y-5 max-h-[75vh] overflow-y-auto">
                  {/* 전체 학생 명단 */}
                  <div className="flex flex-col gap-2">
                    <div className="flex justify-between items-end">
                      <h2 className="text-sm font-semibold text-gray-700">전체 학생 명단</h2>
                      <div className="flex gap-2 items-center">
                        <button
                          onClick={() => setShowRoster(!showRoster)}
                          className={`text-[10px] px-2 py-1 rounded border font-bold transition-colors ${showRoster ? 'bg-indigo-100 text-indigo-700 border-indigo-200' : 'bg-white text-gray-500 border-gray-300 hover:bg-gray-50'}`}
                        >
                          {showRoster ? '📋 명단 표 켜짐' : '📋 명단 표 숨겨짐'}
                        </button>
                        <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">
                          {inputText.split(/[,\n]/).filter(n => n.trim()).length}명
                        </span>
                      </div>
                    </div>
                    <textarea
                      className="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none resize-none leading-relaxed h-32"
                      placeholder="이름을 입력하세요 (엔터 또는 쉼표 구분)"
                      value={inputText}
                      onChange={(e) => setInputText(e.target.value)}
                    />
                  </div>

                  {/* 우선 배치 명단 */}
                  <div className="bg-yellow-50 p-4 rounded-xl border border-yellow-200 flex flex-col gap-2">
                    <h3 className="text-sm font-semibold text-yellow-800 flex items-center gap-1.5">
                      <i className="fa-solid fa-star text-yellow-500"></i> 우선 배치 학생
                    </h3>
                    <p className="text-[11px] text-yellow-700 leading-tight">
                      오른쪽 화면의 빈자리를 한 번 클릭해 <span className="font-bold">🌟우선 구역</span>으로 만들고, 그곳에서 섞일 학생 이름만 아래에 따로 적어주세요.
                    </p>
                    <textarea
                      className="w-full border border-yellow-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-yellow-400 outline-none resize-none leading-relaxed h-20 bg-white"
                      placeholder="우선 구역에 섞을 이름 (엔터/쉼표 구분)"
                      value={priorityStudentsInput}
                      onChange={(e) => setPriorityStudentsInput(e.target.value)}
                    />
                  </div>
                </div>

                <div className="p-4 border-t border-gray-100 bg-gray-50 flex justify-end">
                  <button
                    onClick={() => setIsStudentModalOpen(false)}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-lg transition-colors shadow-sm text-sm"
                  >
                    확인 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
